<!doctype html>
<html lang="it"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>VARCO</title>
<!-- Schermata di caricamento (Beta 0.13): resta solo finché la prima finestra è pronta. -->
<style>
 html,body{margin:0;height:100%;background:#07070e;color:#e9e8f5;font:13px 'Segoe UI Variable','Segoe UI',Arial,sans-serif;overflow:hidden;-webkit-app-region:drag;user-select:none}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 70% 45% at 50% 70%,rgba(124,108,255,.28),transparent 70%),linear-gradient(180deg,#0a0920,#07070e);
  border:1px solid rgba(160,150,255,.28);box-sizing:border-box;border-radius:14px}
 img{width:118px;height:118px;filter:drop-shadow(0 0 26px rgba(124,108,255,.6));
  -webkit-mask:radial-gradient(circle,#000 52%,transparent 71%);mask:radial-gradient(circle,#000 52%,transparent 71%)}
 h1{font-weight:300;font-size:30px;letter-spacing:.55em;padding-left:.55em;margin:10px 0 4px}
 p{font-size:9px;letter-spacing:.5em;padding-left:.5em;color:#b9b6d6;margin:0 0 26px}
 .bar{width:260px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
 .bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#7c6cff,#c9c0ff);animation:load 1.1s ease-in-out infinite}
 small{margin-top:10px;font-size:10px;color:#8f8daa}
 @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
 @media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style></head>
<body><img src="assets/app-icon-256.png" alt=""><h1>VARCO</h1><p>YOUR SPACE. BEYOND THE WEB.</p><div class="bar"><i></i></div><small>Inizializzazione…</small></body></html>
