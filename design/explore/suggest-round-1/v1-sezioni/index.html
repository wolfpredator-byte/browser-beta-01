<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V1 · Sezioni</title><link rel="stylesheet" href="../shared/sg.css">
<style>
/* V1 — una lista sola a sezioni (come la barra di Chrome, ma divisa per categoria). La riga scelta mostra pagine principali e azioni. */
.g{padding:6px 8px}.g+.g{border-top:1px solid var(--line)}
.gh{display:flex;align-items:center;gap:6px;padding:6px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.gh .ic{width:13px;height:13px}.gh i{font-style:normal;opacity:.6}
.r{display:flex;align-items:center;gap:11px;padding:7px 9px;border-radius:11px;cursor:pointer;min-width:0}
.r.sel{background:var(--hi);box-shadow:inset 3px 0 0 var(--acc)}
.r .t{flex:1;display:grid;min-width:0}.r .t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r .t span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .meta{display:flex;gap:4px;align-items:center}
.sub2{display:flex;gap:8px;align-items:center;padding:2px 9px 8px 50px;flex-wrap:wrap}
.foot{display:flex;gap:12px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.ln-fan .g{background:rgba(14,19,26,.9);border-radius:14px;border:1px solid rgba(var(--ink-rgb),.08)}.ln-fan .g+.g{border-top:1px solid rgba(var(--ink-rgb),.08)}
.ln-fan .foot{background:rgba(14,19,26,.9);border-radius:12px}
</style></head><body><div id="app"></div>
<script src="../../../../suggest-sites.js"></script><script src="../../../../suggest-rules.js"></script><script src="../shared/sg.js"></script>
<script>
const {I,GROUP_IC,esc,icon,badges,chips,actbar}=SG;
SG.start({render(r,s){
  let k=0;
  return r.groups.map(g=>`<div class="g"><div class="gh">${I[GROUP_IC[g.id]]}${esc(g.title)} <i>${g.items.length}</i></div>${g.items.map(x=>{const i=k++,sel=i===s.sel;
    const more=sel&&(x.site?.urls?.length||SG.actions(x).length>1);
    return `<div class="r${sel?' sel':''}" data-i="${i}">${icon(x)}<div class="t"><b>${esc(x.title)}</b><span>${esc(x.sub||'')}</span></div><span class="meta">${badges(x)}</span></div>${more?`<div class="sub2">${chips(x)}${SG.actions(x).length>1?actbar(x):''}</div>`:''}`;}).join('')}</div>`).join('')
   +`<div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> scegli</span><span><kbd>Tab</kbd> azioni</span><span><kbd>Invio</kbd> apri</span><span>Tutto in locale · nessun dato online</span></div>`;
}});
</script></body></html>
