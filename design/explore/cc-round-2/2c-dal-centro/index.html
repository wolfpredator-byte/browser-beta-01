<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>2c · Dal centro</title>
<script src="../../lettore-round-2/shared/theme.js"></script>
<link rel="stylesheet" href="../../lettore-round-1/shared/frame.css">
<link rel="stylesheet" href="../../lettore-round-2/shared/varco.css">
<link rel="stylesheet" href="../../cc-round-1/shared/cc.css">
<link rel="stylesheet" href="../shared/parts.css">
<style>
/* 2c — Dal centro: aperto senza testo è l'anello della V3 (sezioni attorno, risultati a ventaglio).
   Appena scrivi, l'anello si rimpicciolisce in un quadrante accanto alla ricerca e sotto si apre la bacheca della V4. */
.c-ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;padding-top:20px;animation:in .25s ease-out}
.c-board{position:absolute;left:62px;right:10px;top:76px;bottom:56px;display:flex;flex-direction:column;gap:12px;padding:4px 18px 0;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.fan{width:420px;display:flex;flex-direction:column;gap:6px}
.fan h3{margin:0 0 4px 6px;font-weight:500;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:center}
.fan h3 .ic{width:13px;height:13px}
.fi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(var(--glass-rgb),.82);backdrop-filter:blur(24px);border:1px solid rgba(var(--line-rgb),.16);min-height:44px;transition:transform .18s}
.fi.sel{border-color:rgba(var(--acc-rgb),.7);background:rgba(var(--acc-rgb),.12);box-shadow:0 0 22px rgba(var(--acc-rgb),.18)}
.fi .t{flex:1;min-width:0;display:flex;flex-direction:column}
.fi .t b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .t span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .cc-acts{display:none}.fi.sel .cc-acts{display:flex;margin-top:6px}
.fi.sel{flex-wrap:wrap}.fi.sel .cc-acts{flex-basis:100%;padding-left:38px}
.fi .cc-act{border-radius:999px}
.top{display:flex;align-items:center;gap:14px}
.top .bd-search{flex:1}
.dial{flex:none}
.scroll{flex:1;overflow:auto;padding-bottom:80px;scrollbar-width:thin}
.foot{position:absolute;left:50%;bottom:60px;transform:translateX(-50%)}
.c-board .foot{bottom:-38px}
.rg.small .rg-core{padding:0;box-shadow:none}
.rg.small .rg-core .ic{width:16px;height:16px;color:var(--acc)}
</style></head><body>
<script src="../../cc-round-1/shared/cc.js"></script>
<script src="../shared/parts.js"></script>
<script>
const {m,I,esc}=CC;
let mode=null;
function render(){
  const root=document.getElementById('cc-root');
  const gs=CC.groups(),cur=CC.current();
  const typing=!!m.q.trim();
  if(!typing){
    // Anello grande
    const g=gs.find(g=>g.id===cur?.group);const ix=P.indexer(gs);
    const core=`<span class="k">Navigator</span><div class="rg-inp">${I.search}<span id="slot"></span></div><span class="t">${g?g.title:''}</span><span class="k" style="letter-spacing:.1em">scrivi per la bacheca</span>`;
    root.innerHTML=`<div class="c-ring">${P.ring({R:230,RI:128,gs,cur,core})}
      <div class="fan"><h3>${g?I[g.icon]+g.title:''} <kbd>←</kbd><kbd>→</kbd></h3>
      ${g&&!g.collapsed?g.shown.map((x,i)=>{const idx=ix(g,i);const d=Math.abs(idx-m.sel);
        return `<div class="fi${idx===m.sel?' sel':''}${x.off?' cc-off':''}" data-i="${idx}" style="transform:translateX(${Math.min(d,4)*-7}px)">${CC.icon(x)}<div class="t"><b>${esc(x.title)}</b>${x.sub?`<span>${esc(x.sub)}</span>`:''}</div>${x.ws!==CC.ACTIVE?`<span class="cc-ws" style="--w:${CC.WS[x.ws]}">${x.ws}</span>`:''}${x.key?`<kbd>${x.key}</kbd>`:''}
        <span class="cc-acts">${x.actions.map((a,j)=>`<button class="cc-act${j===m.act?' on':''}" data-a="${j}">${a}</button>`).join('')}</span></div>`;}).join(''):''}</div></div>
      <div class="foot cc-hint"><span><kbd>←</kbd><kbd>→</kbd> sezione</span><span><kbd>↑</kbd><kbd>↓</kbd> scegli</span><span><kbd>Tab</kbd> azioni</span><span><kbd>Invio</kbd> esegui</span><span><kbd>Esc</kbd> chiudi</span></div>${P.pop()}`;
    root.querySelector('#slot').replaceWith(CC.input('Cerca…'));
    root.querySelectorAll('.fi').forEach(r=>{const x=CC.flat()[+r.dataset.i];
      r.onmouseenter=()=>{const b=r.getBoundingClientRect();CC.hover(x);};r.onmouseleave=()=>CC.hover(null);
      r.onclick=e=>{const a=e.target.closest('[data-a]');m.sel=+r.dataset.i;m.act=a?+a.dataset.a:0;CC.run(x,m.act);CC.update();};});
  }else{
    // Bacheca, con l'anello piccolo come quadrante delle sezioni
    const dial=P.ring({R:28,RI:14,gs,cur,small:true,arcs:false,core:I.search}).replace('class="rg small"','class="rg small dial"');
    P.keepScroll(root,'.scroll',()=>{
      root.innerHTML=`<div class="c-board"${mode==='board'?' style="animation:none"':''}><div class="top"><div class="dial-wrap" title="Sezioni: ← →">${dial}</div><div class="bd-search">${I.search}<span id="slot"></span><kbd>Esc</kbd></div><div class="bd-segm">${CC.scopeChips()}</div></div>
        <div class="scroll">${gs.length?P.board({gs,focus:cur?.group}):P.empty()}</div>${P.actionBar(cur)}
        <div class="foot cc-hint">${CC.hint().replace('<kbd>Alt</kbd><kbd>↓</kbd> sezione','<kbd>Alt</kbd><kbd>←</kbd><kbd>→</kbd> sezione')}</div></div>${P.pop()}`;
      root.querySelector('#slot').replaceWith(CC.input('Cerca, apri o crea qualcosa…'));
    });
    P.bindBoard(root);
  }
  // l'anteprima del passaggio nell'anello grande va accanto alla riga
  mode=typing?'board':'ring';
  P.bindRing(root);
}
CC.mount(render,{lr:false,custom(e){
  const typing=!!CC.m.q.trim();
  const isLR=e.key==='ArrowRight'||e.key==='ArrowLeft';
  if(isLR&&(!typing||e.altKey)){e.preventDefault();P.stepSection(e.key==='ArrowRight'?1:-1);return true;}
  if(isLR&&typing){const inp=document.querySelector('.cc-input');
    if(e.key==='ArrowRight'&&inp.selectionStart===inp.value.length){e.preventDefault();const n=CC.current()?.actions.length||1;CC.m.act=Math.min(n-1,CC.m.act+1);CC.update();return true;}
    if(e.key==='ArrowLeft'&&CC.m.act>0){e.preventDefault();CC.m.act--;CC.update();return true;}}
  return false;
}});
</script>
</body></html>
