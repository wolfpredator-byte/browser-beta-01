<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>V2 · Scaffale neon</title>
<link rel="stylesheet" href="../shared/frame.css">
<style>
/* Famiglia: neon-glass (pin 7–12, 39, 56). Superfici nere, il colore vive solo come luce: bordo a gradiente e alone presi dalla copertina.
   Struttura: il pannello è uno scaffale a tutta larghezza che sale dalla barra; ogni media è una card affiancata. */
.mini{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border-radius:12px;cursor:pointer;position:relative;
  background:#0b0b12;isolation:isolate}
.mini::before{content:'';position:absolute;inset:-1px;border-radius:13px;padding:1px;background:linear-gradient(120deg,var(--a),var(--b));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1}
.mini::after{content:'';position:absolute;inset:4px;border-radius:12px;background:radial-gradient(60% 120% at 15% 50%,var(--a),transparent 70%);opacity:.35;filter:blur(12px);z-index:-2}
.mini .art{width:28px;height:28px;border-radius:8px;flex:none}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;width:14px;flex:none}
.eq i{flex:1;background:var(--a);border-radius:1px;height:30%;box-shadow:0 0 6px var(--a)}
.playing .eq i{animation:eq .9s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{to{height:100%}}
.mini .txt{display:flex;flex-direction:column;width:180px;min-width:0;line-height:1.15}
.mini .txt b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt span{font-size:10.5px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#e9e7ff;opacity:.85;transition:all .15s}
.nb:hover{opacity:1;background:rgba(255,255,255,.07)}.nb .ic{width:16px;height:16px}
.nb.main{background:#fff;color:#000;opacity:1;box-shadow:0 0 14px var(--a)}
.nb.on{color:var(--a);opacity:1;text-shadow:0 0 8px var(--a);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--a)}
.count{font-size:10px;opacity:.6}
/* Scaffale */
.shelf{position:absolute;left:10px;right:10px;bottom:6px;padding:16px 16px 12px;border-radius:20px;background:rgba(6,6,10,.94);border:1px solid rgba(255,255,255,.07);
  box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(30px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .2s}
body.panel-open .shelf{transform:none;opacity:1;pointer-events:auto}
body.panel-open .vf-page{filter:brightness(.35)}
.shelf-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
.shelf-head h3{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;opacity:.8}
.shelf-head span{font-size:11px;opacity:.45}
.shelf-head .switch{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:11.5px;opacity:.75}
.tog{width:30px;height:16px;border-radius:999px;background:#222;position:relative;box-shadow:inset 0 0 0 1px #333}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#777;transition:all .2s}
.tog.on{background:#0e2a1d;box-shadow:inset 0 0 0 1px #2bd67b,0 0 10px rgba(43,214,123,.4)}.tog.on::after{left:16px;background:#2bd67b}
.cards{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#333 transparent}
.card{--a:#888;--b:#444;flex:none;width:300px;scroll-snap-align:start;position:relative;border-radius:18px;padding:14px;background:#0c0c13;isolation:isolate}
.card::before{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(150deg,var(--a),transparent 45%,var(--b));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1;opacity:.55}
.card.playing::before{opacity:1}
.card::after{content:'';position:absolute;left:10%;right:10%;top:-10px;height:90px;background:var(--a);filter:blur(40px);opacity:.18;z-index:-2}
.card.playing::after{opacity:.4}
.card .top{display:flex;gap:12px;align-items:center}
.card .art{width:64px;height:64px;border-radius:14px;flex:none;box-shadow:0 0 24px -4px var(--a)}
.card h4{margin:0;font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:11.5px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .where{font-size:10.5px;opacity:.45;margin-top:2px}
.scrub{display:flex;align-items:center;gap:8px;font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.85;margin:12px 0 8px}
.scrub input{flex:1;appearance:none;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--a) var(--p),#2a2a35 var(--p));outline:none}
.scrub input::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--a)}
.scrub .live{color:#ff5470;font-weight:700;letter-spacing:.12em;text-shadow:0 0 10px #ff5470}
.ctl{display:flex;align-items:center;gap:4px}
.ctl .t{display:flex;gap:2px;flex:1;justify-content:center}
.ctl .nb.main{width:38px;height:38px;border-radius:50%}
.ctl .side{display:flex;gap:2px}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #1d1d27}
.go{font-size:11px;opacity:.65;display:flex;gap:4px;align-items:center}.go:hover{opacity:1;color:var(--a)}.go .ic{width:12px;height:12px}
.empty{padding:26px;text-align:center;opacity:.55}
</style></head><body>
<script src="../shared/icons.js"></script><script src="../shared/media.js"></script>
<script>
const vars=m=>`--a:${m.art[0]};--b:${m.art[1]}`;
const art=m=>`<span class="art" style="${artStyle(m)}"></span>`;
function renderMini(slot,list,{tick}){
  if(tick)return;
  const m=Media.primary();if(!m){slot.innerHTML='';return;}
  const b=buttonsOf(m);
  const three=b.transport.filter(x=>x.main||x.id===(b.c.previous?'prev':'back')||x.id===(b.c.next?'next':'fwd'));
  slot.innerHTML=`<div class="mini ${m.playing?'playing':''}" style="${vars(m)}" title="Apri il lettore">${art(m)}<span class="eq"><i></i><i></i><i></i></span>
    <span class="txt"><b>${m.title}</b><span>${m.pip?'In finestrella · ':''}${m.subtitle}</span></span>${list.length>1?`<span class="count">+${list.length-1}</span>`:''}<span class="b" style="display:flex;gap:2px"></span></div>`;
  drawButtons(slot.querySelector('.b'),[...three,...b.modes],'nb');
  slot.querySelector('.mini').onclick=()=>Media.toggleOpen();
}
function renderPanel(slot,list,{tick}){
  if(!slot.firstChild)slot.innerHTML='<div class="shelf" role="dialog" aria-label="In riproduzione"></div>';
  const box=slot.firstChild;
  if(tick){tickScrubbers(box);return;}
  box.innerHTML=`<div class="shelf-head"><h3>In riproduzione</h3><span>${list.length?list.length+' media in '+new Set(list.map(m=>m.workspace)).size+' workspace':''}</span>
    <label class="switch"><button class="tog ${Media.autoPip?'on':''}" aria-label="Finestrella automatica"></button>Finestrella automatica</label></div><div class="cards"></div>`;
  box.querySelector('.tog').onclick=()=>Media.setAutoPip(!Media.autoPip);
  const cards=box.querySelector('.cards');
  if(!list.length){cards.innerHTML='<div class="empty">Niente in riproduzione. Audio e video di schede, pannelli web e widget compaiono qui.</div>';return;}
  cards.replaceChildren(...list.map(m=>{
    const b=buttonsOf(m),c=document.createElement('article');
    c.className='card'+(m.playing?' playing':'');c.style.cssText=vars(m);c.dataset.key=m.key;
    c.innerHTML=`<div class="top">${art(m)}<div style="min-width:0"><h4>${m.title}</h4><div class="sub">${m.subtitle}</div><div class="where">${m.where} · ${m.workspace}</div></div></div>
      <div class="sc"></div><div class="ctl"><div class="side l"></div><div class="t"></div><div class="side r"></div></div>
      <div class="foot"><span style="font-size:10.5px;opacity:.4">${m.site}</span><button class="go">Vai ${IC.go}</button></div>`;
    c.querySelector('.sc').append(scrubber(m));
    drawButtons(c.querySelector('.t'),b.transport,'nb');
    drawButtons(c.querySelector('.l'),b.modes,'nb');
    drawButtons(c.querySelector('.r'),b.extra,'nb');
    c.querySelector('.go').onclick=()=>Media.act(m.key,'focus');
    return c;
  }));
}
Media.start({renderMini,renderPanel});
document.querySelector('.vf-page').addEventListener('click',()=>Media.open&&Media.setOpen(false));
</script></body></html>
