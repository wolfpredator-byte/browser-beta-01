<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>V4 · Dock compatto</title>
<link rel="stylesheet" href="../shared/frame.css">
<style>
/* Famiglia: pro-dock (pin 26, 33, 46, 48). Strumento da lavoro: grafite, tutto piccolo e ordinato, un accento solo per "attivo".
   Struttura: un popover ancorato al mini-lettore. Elenco denso delle fonti a sinistra, dettaglio a destra, barra verticale a pillola per gli extra. */
:root{--bg:#141518;--bg2:#1b1c20;--line:#2a2c31;--muted:#8d9099;--acc:#5b8cff}
.mini{display:flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 3px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.mini .art{width:24px;height:24px;border-radius:5px;flex:none}
.mini .txt{width:170px;min-width:0;display:flex;align-items:baseline;gap:6px}
.mini .txt b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .txt span{font-size:11px;color:var(--muted);white-space:nowrap}
.mini .bar{position:absolute}
.ib{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#c7c9d1}
.ib:hover{background:#26282d;color:#fff}.ib .ic{width:15px;height:15px}
.ib.main{color:#fff}
.ib.on{color:var(--acc);background:rgba(91,140,255,.12)}
.cnt{font-size:10.5px;color:var(--muted);padding:1px 6px;border-radius:5px;background:#24262b}
.prog{height:2px;background:#2a2c31;border-radius:2px;overflow:hidden;width:100%}.bar-fill{height:100%;background:var(--acc);display:block}
/* Popover */
.pop{position:absolute;right:68px;bottom:6px;width:min(700px,calc(100% - 80px));height:380px;display:grid;grid-template-columns:270px 1fr 44px;
  background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;
  transform:translateY(8px);opacity:0;pointer-events:none;transition:transform .18s ease-out,opacity .15s}
body.panel-open .pop{transform:none;opacity:1;pointer-events:auto}
.pop::after{content:'';position:absolute;right:120px;bottom:-6px;width:12px;height:12px;background:var(--bg);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.list header b{color:#e6e7ec;font-weight:600;font-size:12px}
.rows{overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
.r{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;padding:7px 12px;text-align:left;border-bottom:1px solid #1d1e22}
.r:hover{background:#1a1b1f}.r.sel{background:#1e2230;box-shadow:inset 2px 0 0 var(--acc)}
.r .art{width:28px;height:28px;border-radius:5px}
.r span{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.r b{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .st{font-size:10px;color:var(--muted)}.r .st.p{color:#4ad991}
.ws{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:4px;background:#25272c;color:#aeb1ba;margin-right:4px}
.detail{display:flex;flex-direction:column;padding:16px;min-width:0}
.detail .head{display:flex;gap:14px}
.detail .art{width:96px;height:96px;border-radius:10px;flex:none}
.detail h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.detail .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .meta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.scrub{display:flex;align-items:center;gap:8px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);margin:auto 0 10px}
.scrub input{flex:1;appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,#e6e7ec var(--p),#2c2e33 var(--p));outline:none}
.scrub input::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.scrub .live{color:#ff5f6d;font-weight:600}
.trans{display:flex;align-items:center;justify-content:center;gap:4px}
.trans .ib{width:34px;height:34px;border-radius:8px}.trans .ib .ic{width:17px;height:17px}
.trans .ib.main{width:42px;height:42px;border-radius:50%;background:#e9eaef;color:#111}
.modes{display:flex;gap:6px;justify-content:center;margin-top:10px}
.modes .ib{width:auto;padding:0 10px;gap:6px;display:flex;font-size:11px;border:1px solid var(--line)}
.rail{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:#121316}
.rail .ib{width:30px;height:30px;border-radius:999px}
.rail .sep{width:16px;height:1px;background:var(--line)}
.kbd{margin-top:auto;font-size:9px;color:#5d6068;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em}
.empty{grid-column:1/-1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px}
</style></head><body>
<script src="../shared/icons.js"></script><script src="../shared/media.js"></script>
<script>
let sel=null;
const art=m=>`<span class="art" style="${artStyle(m)}"></span>`;
function renderMini(slot,list,{tick}){
  if(tick){tickScrubbers(slot);return;}
  const m=Media.primary();if(!m){slot.innerHTML='';return;}
  const b=buttonsOf(m);
  const three=b.transport.filter(x=>x.main||x.id===(b.c.previous?'prev':'back')||x.id===(b.c.next?'next':'fwd'));
  slot.innerHTML=`<div class="mini" data-key="${m.key}" title="Apri il lettore">${art(m)}<span style="display:flex;flex-direction:column;gap:3px"><span class="txt"><b>${m.title}</b><span>${m.live?'live':Media.time(m.duration)}</span></span><span class="prog"><i class="bar-fill" style="width:${m.duration?m.position/m.duration*100:0}%"></i></span></span>${list.length>1?`<span class="cnt">${list.length}</span>`:''}<span class="k" style="display:flex"></span></div>`;
  drawButtons(slot.querySelector('.k'),three,'ib');
  slot.querySelector('.mini').onclick=()=>Media.toggleOpen();
}
function renderPanel(slot,list,{tick}){
  if(!slot.firstChild)slot.innerHTML='<div class="pop" role="dialog" aria-label="In riproduzione"></div>';
  const box=slot.firstChild;
  if(tick){tickScrubbers(box);return;}
  if(!list.length){box.innerHTML='<div class="empty">Niente in riproduzione.<br><small>Audio e video di schede, pannelli web e widget, di ogni workspace.</small></div>';return;}
  const m=list.find(x=>x.key===sel)||Media.primary();sel=m.key;
  const b=buttonsOf(m);
  box.innerHTML=`<div class="list"><header><b>In riproduzione</b>${list.filter(x=>x.playing).length} attivi · ${list.length} totali</header><div class="rows"></div></div>
    <div class="detail" data-key="${m.key}"><div class="head">${art(m)}<div style="min-width:0"><h3>${m.title}</h3><div class="sub">${m.subtitle}</div>
      <div class="meta"><span class="ws">${m.workspace}</span><span>${m.where}</span><span>·</span><span>${m.site}</span></div></div></div>
      <div class="sc" style="margin-top:auto"></div><div class="trans"></div><div class="modes"></div></div>
    <div class="rail"></div>`;
  box.querySelector('.sc').append(scrubber(m));
  drawButtons(box.querySelector('.trans'),b.transport,'ib');
  drawButtons(box.querySelector('.modes'),b.modes,'ib');
  box.querySelectorAll('.modes .ib').forEach((el,i)=>el.insertAdjacentText('beforeend',b.modes[i].id==='shuffle'?'Shuffle':Media.repeatLabel(m.repeat).replace('Ripeti ','Ripeti: ')));
  const rail=box.querySelector('.rail');
  const go={id:'go',icon:IC.go,label:'Vai alla '+(m.kind==='panel'?'pannello':m.kind==='widget'?'Home':'scheda'),run:()=>Media.act(m.key,'focus')};
  const ap={id:'ap',icon:IC.pip,label:'Finestrella automatica: '+(Media.autoPip?'attiva':'spenta'),on:Media.autoPip,run:()=>Media.setAutoPip(!Media.autoPip)};
  drawButtons(rail,[...b.extra,go],'ib');
  rail.append(Object.assign(document.createElement('i'),{className:'sep'}));
  const apBox=document.createElement('div');drawButtons(apBox,[ap],'ib');rail.append(apBox.firstChild);
  rail.append(Object.assign(document.createElement('span'),{className:'kbd',textContent:'Spazio · ← → · Esc'}));
  box.querySelector('.rows').replaceChildren(...list.map(x=>{const r=document.createElement('button');r.className='r'+(x.key===m.key?' sel':'');
    r.innerHTML=`${art(x)}<span><b>${x.title}</b><small><i class="ws">${x.workspace}</i>${x.subtitle}</small></span><i class="st ${x.playing?'p':''}">${x.playing?'▶':x.live?'live':Media.time(x.position)}</i>`;
    r.onclick=()=>{sel=x.key;renderPanel(slot,Media.items,{});};return r;}));
}
Media.start({renderMini,renderPanel});
document.querySelector('.vf-page').addEventListener('click',()=>Media.open&&Media.setOpen(false));
</script></body></html>
