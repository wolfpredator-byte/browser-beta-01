<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2 · Isola</title><link rel="stylesheet" href="../shared/tut.css">
<style>
/* V2 — isola: niente penombra, VARCO resta tutto usabile. Un'isola scende dalla barra del titolo con il passo;
   il pulsante vero ha un anello che pulsa e un'etichetta «Qui». */
.island{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 14px;border-radius:24px;
  background:var(--glass);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55);animation:drop .3s cubic-bezier(.3,.8,.3,1.1);max-width:calc(100vw - 32px)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
.island.big{flex-direction:column;align-items:center;text-align:center;padding:22px 26px 14px;border-radius:28px;gap:10px;width:440px}
.prog{position:relative;width:42px;height:42px;flex:none}
.prog svg{width:42px;height:42px;transform:rotate(-90deg)}.prog circle{fill:none;stroke-width:3}.prog .bg{stroke:rgba(255,255,255,.12)}.prog .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .4s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.txt{display:grid;min-width:0;max-width:420px}.txt b{font-size:15px}.txt span{font-size:12.5px;color:var(--mut)}
.island .acts{display:flex;gap:4px;align-items:center}
.island .x{position:static}
.ring{position:absolute;border-radius:12px;border:2px solid var(--acc);animation:pulse 1.4s infinite;transition:all .35s}
.qui{position:absolute;padding:4px 10px;border-radius:999px;background:var(--acc);color:#061016;font-weight:700;font-size:11.5px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.island.big .swatches{justify-content:center}
.tip{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:520px;animation:popIn .2s;font-size:12.5px}
.tip>.ic{color:var(--acc)}
</style></head><body><div id="app"></div>
<script src="../shared/frame-rects.js"></script><script src="../shared/tut.js"></script>
<script>
const {I,esc}=TUT;
const top0=()=>{const k=Math.min(innerWidth/FRAME.size[0],(innerHeight-50)/FRAME.size[1]);const oy=((innerHeight-50)-FRAME.size[1]*k)/2;return Math.round(oy+30*k);};
TUT.start({
  render({st,idx,total,r,done,pulse,THEMES,accent}){
    const C=2*Math.PI*18,frac=(idx+(done?1:0))/total;
    const prog=`<span class="prog"><svg viewBox="0 0 42 42"><circle class="bg" cx="21" cy="21" r="18"/><circle class="fg" cx="21" cy="21" r="18" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><b>${idx+1}/${total}</b></span>`;
    const act=st.themes?'':`<button class="btn${done?' done':''}" ${st.target||st.action.key?'data-do':'data-next'}>${done?I.check+'Fatto':esc(st.action.label)}</button>`;
    const nav=`${idx?`<button class="ghost" data-prev title="Indietro (←)">${I.left}</button>`:''}<button class="ghost" data-next title="Avanti (→)">${idx===total-1?'Fine':'Avanti'}</button><button class="never" data-never title="Non mostrare più">${I.eyeoff}</button><button class="x" data-close title="Chiudi (Esc)">${I.close}</button>`;
    if(!r||st.themes){
      return `<div class="island big" style="top:${top0()}px">${prog}<b style="font-size:21px">${esc(st.title)}</b><span style="color:var(--mut)">${esc(st.text)}</span>
        ${st.themes?`<div class="swatches">${THEMES.map(([n,c])=>`<button class="sw${accent===c?' on':''}" style="--c:${c}" data-theme="${c}"><i></i>${n}</button>`).join('')}</div>`:''}
        <div class="acts">${act}${nav}</div></div>`;
    }
    const pad=5,quiLeft=r.x+r.w<innerWidth*0.25?r.x+r.w+12:r.cx-18,quiTop=r.x+r.w<innerWidth*0.25?r.cy-12:(r.y>innerHeight*0.5?r.y-34:r.y+r.h+10);
    return `<div class="ring" style="left:${r.x-pad}px;top:${r.y-pad}px;width:${r.w+pad*2}px;height:${r.h+pad*2}px"></div>
      <div class="qui" style="left:${quiLeft}px;top:${quiTop}px">${r.x+r.w<innerWidth*0.25?'← ':''}Qui</div>
      <div class="island" style="top:${top0()}px">${prog}<span class="txt"><b>${esc(st.title)}</b><span>${esc(st.text)}</span></span><span class="acts">${act}${nav}</span></div>`;
  },
  hint({h,r}){
    if(!r)return '';
    const left=r.x+r.w<innerWidth*0.25?r.x+r.w+12:Math.max(12,Math.min(innerWidth-540,r.cx-200)),top=r.x+r.w<innerWidth*0.25?r.cy-20:(r.y<innerHeight*0.4?r.y+r.h+10:r.y-50);
    return `<div class="ring" style="left:${r.x-4}px;top:${r.y-4}px;width:${r.w+8}px;height:${r.h+8}px"></div><div class="tip" style="left:${left}px;top:${top}px">${I.bulb}<span>${esc(h.text)}</span><button class="btn" data-hint-ok>Ok</button><button class="never" data-hint-never title="Non mostrare più suggerimenti">${I.eyeoff}</button></div>`;
  }
});
</script></body></html>
