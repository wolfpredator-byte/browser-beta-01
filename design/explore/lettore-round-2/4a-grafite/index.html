<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>4a · Grafite con accento VARCO</title>
<script src="../shared/theme.js"></script>
<link rel="stylesheet" href="../../lettore-round-1/shared/frame.css">
<link rel="stylesheet" href="../shared/varco.css">
<link rel="stylesheet" href="../shared/dock.css">
<style>
/* 4a — La V4 resta com'è (grafite, solida, densa). Da VARCO prende: accento del tema, titoli in maiuscoletto spaziato,
   linee sottili del colore del tema, pulsante principale pieno nel colore d'accento. È la più vicina alla V4. */
:root{--bg:#121418;--bg2:#181b20;--muted:#8a929b}
.pop,.mini{--line:rgba(var(--line-rgb),.16)}
.pop{border-color:rgba(var(--line-rgb),.22);border-radius:12px}
.k-title{font-weight:400;letter-spacing:.24em;text-transform:uppercase;font-size:10.5px}
.r.sel{background:rgba(var(--acc-rgb),.10);box-shadow:inset 2px 0 0 var(--acc)}
.r .st.p{color:var(--acc)}
.ws{background:rgba(var(--acc-rgb),.12);color:var(--acc)}
.trans .ib.main{background:var(--acc);color:#061014}
.ib.on{color:var(--acc);background:rgba(var(--acc-rgb),.12)}
.modes .ib{border-color:rgba(var(--line-rgb),.2)}
.modes .ib.on{border-color:rgba(var(--acc-rgb),.6)}
.scrub input{background:linear-gradient(90deg,var(--acc) var(--p),#2a2e34 var(--p))}
.bar-fill{background:var(--acc)}
.mini{border-color:rgba(var(--line-rgb),.18)}
.mini .ib.main{color:var(--acc)}
.cnt{background:rgba(var(--acc-rgb),.14);color:var(--acc)}
.pop::after{border-color:rgba(var(--line-rgb),.22)}
</style></head><body>
<script src="../../lettore-round-1/shared/icons.js"></script><script src="../../lettore-round-1/shared/media.js"></script>
<script src="../shared/dock.js"></script>
</body></html>
