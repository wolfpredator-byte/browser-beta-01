<style>
/* Tela libera: stessi riquadri bento, ma ognuno dove vuoi tu, collegati da fili. */
#world{width:1px;height:1px;padding:0}
#areas,#tiles{position:absolute;left:0;top:0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.tile{position:absolute;grid-column:auto;grid-row:auto;overflow:visible}
.tile .hero-line{border-radius:16px 16px 0 0}
.solo-img{border-radius:inherit;overflow:hidden}
.tile.sel{border-color:rgba(var(--v-accent-rgb),.7);box-shadow:0 0 0 1px rgba(var(--v-accent-rgb),.5),0 12px 40px -6px rgba(0,0,0,.85)}
.tile.lit{border-color:rgba(var(--v-alt-rgb),.6);box-shadow:0 0 0 1px rgba(var(--v-alt-rgb),.35),0 0 28px -4px rgba(var(--v-alt-rgb),.35)}
.tile.target{border-color:var(--v-alt);box-shadow:0 0 0 2px var(--v-alt),0 0 30px rgba(var(--v-alt-rgb),.4)}
.tile.dim,.area.dim{opacity:.22}
.tile.moving{transition:none;box-shadow:0 26px 70px rgba(0,0,0,.75);z-index:5}
/* Prese sui quattro lati: si trascina da qui per collegare */
.port{position:absolute;width:14px;height:14px;border-radius:50%;background:#0d0c18;border:2px solid var(--v-alt);z-index:3;cursor:crosshair;opacity:0;transition:opacity .15s,transform .15s}
.tile:hover .port,body.linking .port{opacity:1}
.port:hover{transform:scale(1.35);background:var(--v-alt)}
.port.t{top:-8px;left:calc(50% - 7px)}.port.b{bottom:-8px;left:calc(50% - 7px)}.port.l{left:-8px;top:calc(50% - 7px)}.port.r{right:-8px;top:calc(50% - 7px)}
.rs{position:absolute;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;opacity:0;z-index:2;
  background:linear-gradient(135deg,transparent 55%,rgba(169,155,255,.6) 55% 62%,transparent 62% 72%,rgba(169,155,255,.6) 72% 79%,transparent 79%)}
.tile:hover .rs{opacity:1}
.links-n{display:inline-flex;align-items:center;gap:3px;color:var(--v-alt)}
.links-n .ms{font-size:14px}
/* Fili */
#wires path{fill:none}
#wires .w{stroke-width:2.2;cursor:pointer;pointer-events:stroke}
#wires .hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#wires .glow{stroke-width:9;opacity:.14;pointer-events:none}
#wires g.lit .w{stroke-width:3.2}#wires g.lit .glow{opacity:.35}
#wires g.sel .w{stroke-dasharray:none;stroke-width:3.4}
#wires g.dim{opacity:.15}
#wires .end{stroke:none}
#wires .flow{stroke-width:2.2;stroke-dasharray:2 14;stroke-linecap:round;animation:flow 1.4s linear infinite;pointer-events:none;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-32}}
.wlabel{position:absolute;transform:translate(-50%,-50%);padding:2px 9px;border-radius:99px;background:rgba(13,12,24,.92);border:1px solid var(--edge-2);font:500 10px/16px var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;pointer-events:auto;cursor:pointer}
#labels{position:absolute;left:0;top:0}
.wbar{position:fixed;z-index:60;display:none;align-items:center;gap:4px;padding:5px;border-radius:12px;background:var(--chrome);backdrop-filter:blur(20px);border:1px solid var(--edge-2);box-shadow:0 16px 40px -8px rgba(0,0,0,.85)}
.wbar.on{display:flex}
.wbar input{width:150px;border:0;outline:none;background:rgba(255,255,255,.06);border-radius:7px;padding:5px 8px;font:12px var(--body)}
#wsw{display:flex;gap:5px;padding:0 4px}
.wbar .sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent}
.wbar .sw.on{border-color:#fff}
.wbar button{height:28px;min-width:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.wbar button:hover{background:rgba(255,255,255,.07);color:#fff}
/* Aree: riquadri trasparenti che tengono insieme altri riquadri */
.area{position:absolute;border-radius:22px;border:1.5px dashed color-mix(in srgb,var(--ac) 55%,transparent);background:color-mix(in srgb,var(--ac) 5%,transparent)}
.area .ah{position:absolute;left:14px;top:-15px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:99px;background:#100f1c;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);cursor:grab;user-select:none}
.area .ah .ms{font-size:15px;color:var(--ac)}
.area .ah input{border:0;outline:none;background:none;width:var(--lw,140px);font:600 12px var(--head);color:var(--text)}
.area .ah button{color:var(--dim);display:grid;place-items:center;opacity:0}
.area:hover .ah button{opacity:1}
.area .rs{opacity:0}.area:hover .rs{opacity:1}
/* Nodi singoli */
.solo-img{position:absolute;inset:0;background-size:cover;background-position:center}
.solo-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,18,.95),rgba(11,11,18,.1) 55%,rgba(11,11,18,.55))}
.tile.shot1 .th{position:relative;z-index:1}
.tile.shot1 .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;display:flex;align-items:center;gap:8px}
.tile.shot1 .cap b{font:600 13px var(--head)}
.field{width:100%;border:0;outline:none;background:none;padding:0;min-width:0}
.link-node{display:flex;align-items:center;gap:12px}
.link-node .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.link-node b input{font:600 14px var(--head)}
.link-node small input{font:10.5px var(--mono);letter-spacing:.04em;color:var(--dim)}
.hint{position:fixed;left:50%;top:116px;transform:translateX(-50%);z-index:40;padding:7px 14px;border-radius:99px;background:rgba(var(--v-accent-rgb),.92);color:#fff;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.hint.on{display:block}
.mini{width:120px;height:56px;cursor:pointer}
.mini canvas{width:100%;height:100%;display:block}
.cmenu{position:fixed;z-index:65;width:300px;max-height:440px;display:none;flex-direction:column;border-radius:14px;background:var(--chrome);backdrop-filter:blur(22px);border:1px solid var(--edge-2);box-shadow:0 16px 40px -8px rgba(0,0,0,.85);overflow:hidden}
.cmenu.on{display:flex}
.cm-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.cm-head input{flex:1;border:0;outline:none;background:none;font:500 13px var(--body)}
.cm-head .ms{color:var(--v-alt)}
.cm-back{display:grid;place-items:center;color:var(--muted)}
.cm-body{overflow:auto;padding:4px 6px 8px}
.cm-sec{padding:8px 8px 3px;font:500 10px/14px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.cm-body>button,.cm-list button{width:100%;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;text-align:left}
.cm-body>button:hover,.cm-body>button.first,.cm-list button:hover{background:rgba(var(--v-accent-rgb),.16)}
.cm-body small{margin-left:auto;color:var(--dim);font:10px var(--mono);letter-spacing:.04em}
.cm-body .ms{color:var(--v-alt);font-size:17px}
.cm-shots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}
.cm-shots button{aspect-ratio:16/10;border-radius:8px;border:1px solid var(--edge)}
.cm-shots button:hover{outline:2px solid var(--v-alt)}
.cm-empty{padding:14px;color:var(--dim)}
#view.drop{outline:2px dashed var(--v-alt);outline-offset:-10px}
</style>

    const s=toWorld(e.clientX,e.clientY),o={x:a.x,y:a.y},start=inside.map(k=>[k,S.tiles[k].x,S.tiles[k].y]);
    const mv=ev=>{const p=toWorld(ev.clientX,ev.clientY),dx=snapv(o.x+p.x-s.x)-o.x,dy=snapv(o.y+p.y-s.y)-o.y;a.x=o.x+dx;a.y=o.y+dy;place(el,a);
      for(const [k,x,y] of start){S.tiles[k].x=x+dx;S.tiles[k].y=y+dy;place(tilesEl.querySelector(`[data-id="${k}"]`),S.tiles[k]);}drawWires();};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save();};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);});
  el.querySelector('.rs').addEventListener('pointerdown',e=>resize(e,a,el));}

/* ---------- Menu ---------- */
function sizeMenu(e,id){e.stopPropagation();const m=document.getElementById('sizeMenu'),t=T[typeOf(id)],cur=S.tiles[id];
  m.innerHTML=t.sizes.map(s=>`<button data-s="${s}"><span class="ms">${s[0]===cur.w&&s[1]===cur.h?'radio_button_checked':'radio_button_unchecked'}</span>${s[0]} × ${s[1]}</button>`).join('');
  const r=e.currentTarget.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-250)+'px';m.style.top=r.bottom+6+'px';m.classList.add('on');
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.s.split(',').map(Number);Object.assign(S.tiles[id],{w,h});place(tilesEl.querySelector(`[data-id="${id}"]`),S.tiles[id]);drawWires();save();m.classList.remove('on');});}
const ADD=[['timer','timer','Timer','tanti'],['note','sticky_note_2','Nota','tante'],['shot','add_photo_alternate','Screenshot','dal PC'],['link','link','Link','tanti'],['area','select_all','Area','raggruppa'],
  ['hero','monitor_heart','Stato del progetto','uno'],['tasks','checklist','Attività','uno'],['shots','photo_library','Galleria','uno'],['files','description','File recenti','uno'],['stream','timeline','Cronologia','uno'],['notes','edit_note','Note del progetto','uno'],['res','bookmarks','Risorse','uno']];
function center(){const r=viewEl.getBoundingClientRect();return toWorld(r.left+r.width/2,r.top+r.height/2);}
function addMenu(anchor){const m=document.getElementById('menu');
  m.innerHTML=ADD.map(([id,i,n,s])=>{const has=T[id]?.one&&S.tiles[id];return `<button data-id="${id}"${has?' disabled style="opacity:.4;cursor:default"':''}><span class="ms">${i}</span>${n}<small>${has?'c\'è già':s}</small></button>`}).join('');
  m.classList.add('on');const r=anchor.getBoundingClientRect(),h=m.getBoundingClientRect().height;m.style.left=Math.min(r.left,innerWidth-260)+'px';m.style.top=(r.bottom+h+10>innerHeight?r.top-h-8:r.bottom+6)+'px';
  m.querySelectorAll('button:not([disabled])').forEach(b=>b.onclick=()=>{m.classList.remove('on');const k=b.dataset.id,c=center();
    if(k==='shot')return pickFiles(c);if(k==='area'){const id='area-'+(++S.n);S.areas[id]={x:snapv(c.x-300),y:snapv(c.y-200),w:600,h:400,t:'Nuova area',c:COLORS[S.n%COLORS.length]};render();save();return;}
    if(T[k].one){const [w,h]=T[k].sizes[0];S.tiles[k]={x:snapv(c.x-w/2),y:snapv(c.y-h/2),w,h};render();save();flash(k);return;}
    newTile(k,k==='timer'?{timer:{label:'Timer',mode:'down',secs:300,left:300,run:false}}:k==='note'?{text:''}:{link:['link','Nuovo link','indirizzo…']},c.x-150,c.y-60);});}
document.addEventListener('click',e=>{if(!e.target.closest('.menu,[data-size],#addTop,#addDock,[data-act=add]'))document.querySelectorAll('.menu').forEach(m=>m.classList.remove('on'));});
document.getElementById('addTop').onclick=e=>{e.stopPropagation();addMenu(e.currentTarget);};
document.getElementById('addDock').onclick=e=>{e.stopPropagation();addMenu(e.currentTarget);};

/* Screenshot dal PC: dal pulsante o trascinando le immagini sulla tela */
let dropAt=null;const fileIn=document.getElementById('file');
function pickFiles(at){dropAt=at;fileIn.click();}
fileIn.onchange=()=>{addImages(fileIn.files,dropAt);fileIn.value='';};
function addImages(files,at){const link=pendingLink;pendingLink=null;[...files].filter(f=>f.type.startsWith('image/')).forEach((f,i)=>{const r=new FileReader();r.onload=()=>{const s={src:r.result,n:f.name,w:'adesso'};
  S.shots.unshift(s);S.sel=0;if(at){const nid=newTile('shot',{shot:s},at.x-200+i*48,at.y-140+i*48);if(link)addLink(link,nid);}else{refill('shots');refill('hero');save();}};r.readAsDataURL(f);});}
viewEl.addEventListener('dragover',e=>{e.preventDefault();viewEl.classList.add('drop');});
viewEl.addEventListener('dragleave',e=>{if(e.target===viewEl)viewEl.classList.remove('drop');});
viewEl.addEventListener('drop',e=>{e.preventDefault();viewEl.classList.remove('drop');addImages(e.dataTransfer.files,toWorld(e.clientX,e.clientY));});

/* ---------- Filtri, strumenti, tastiera ---------- */
const match=id=>filter==='all'||T[typeOf(id)].g===filter;
function applyFilter(){tilesEl.querySelectorAll('.tile').forEach(t=>t.classList.toggle('dim',!match(t.dataset.id)));areasEl.querySelectorAll('.area').forEach(a=>a.classList.toggle('dim',filter!=='all'));drawWires();}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));filter=b.dataset.f;applyFilter();});
function setTool(t){tool=t;linkFrom=null;document.querySelectorAll('#rail [data-tool]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tool===t));viewEl.classList.toggle('pan',t==='pan');
  document.body.classList.toggle('linking',t==='link');hint.textContent='Clicca il primo riquadro da collegare';hint.classList.toggle('on',t==='link');}
document.querySelectorAll('#rail [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelector('[data-act=add]').onclick=e=>{e.stopPropagation();addMenu(e.currentTarget);};
document.querySelector('[data-act=note]').onclick=()=>{const c=center();const id=newTile('note',{text:''},c.x-156,c.y-108);setTimeout(()=>tilesEl.querySelector(`[data-id="${id}"] textarea`)?.focus(),30);};
document.querySelector('[data-act=shot]').onclick=()=>{pendingLink=null;pickFiles(center());};
document.querySelector('[data-act=area]').onclick=()=>{const c=center(),id='area-'+(++S.n);S.areas[id]={x:snapv(c.x-300),y:snapv(c.y-200),w:600,h:400,t:'Nuova area',c:COLORS[S.n%COLORS.length]};render();save();};
document.querySelector('[data-act=snap]').onclick=e=>{snap=!snap;e.currentTarget.setAttribute('aria-pressed',snap);};
document.querySelector('[data-act=fit]').onclick=()=>fit(true);
document.querySelector('[data-act=reset]').onclick=()=>{S=structuredClone(START);selWire=null;wbar.classList.remove('on');render();save();fit(true);};
let space=false;
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  if(e.code==='Space'){space=true;viewEl.classList.add('pan');e.preventDefault();}
  if(e.key==='Escape'){setTool('sel');dropWire();selectTile(null);}
  if(e.key==='v')setTool('sel');if(e.key==='h')setTool('pan');if(e.key==='c')setTool('link');if(e.key==='f')fit(true);
  if(e.key==='n')document.querySelector('[data-act=note]').click();
  if((e.key==='Delete'||e.key==='Backspace')&&selWire!=null)document.getElementById('wdel').click();});
addEventListener('keyup',e=>{if(e.code==='Space'){space=false;if(tool!=='pan')viewEl.classList.remove('pan');}});

/* ---------- Muoversi e zoom ---------- */
function zoomAt(f,cx,cy,anim){const r=viewEl.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;const z=Math.min(1.6,Math.max(.25,view.z*f));
  view.x=cx-(cx-view.x)*z/view.z;view.y=cy-(cy-view.y)*z/view.z;view.z=z;applyView();}
viewEl.addEventListener('wheel',e=>{if(e.target.closest('.tb')&&!e.ctrlKey)return;e.preventDefault();const r=viewEl.getBoundingClientRect();
  if(e.ctrlKey)zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX-r.left,e.clientY-r.top);else{view.x-=e.shiftKey?e.deltaY:e.deltaX;view.y-=e.shiftKey?0:e.deltaY;applyView();}},{passive:false});
viewEl.addEventListener('pointerdown',e=>{const bg=e.target===viewEl||e.target===world||e.target===wires||e.target.id==='tiles'||e.target.id==='areas'||e.target.classList.contains('area');
  if(bg){dropWire();selectTile(null);}
  if(!(bg||tool==='pan'||space||e.button===1))return;if(tool==='link'&&!bg)return;e.preventDefault();let lx=e.clientX,ly=e.clientY;viewEl.classList.add('grabbing');
  const mv=ev=>{view.x+=ev.clientX-lx;view.y+=ev.clientY-ly;lx=ev.clientX;ly=ev.clientY;applyView();};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);viewEl.classList.remove('grabbing');};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);},(tool==='pan'));
document.getElementById('zin').onclick=()=>zoomAt(1.15);document.getElementById('zout').onclick=()=>zoomAt(1/1.15);
function bounds(ids){const all=[...ids.map(k=>S.tiles[k]),...(ids.length===Object.keys(S.tiles).length?Object.values(S.areas):[])];
  return {x0:Math.min(...all.map(t=>t.x)),y0:Math.min(...all.map(t=>t.y))-20,x1:Math.max(...all.map(t=>t.x+t.w)),y1:Math.max(...all.map(t=>t.y+t.h))};}
function goTo(b,anim){const r=viewEl.getBoundingClientRect(),pad={l:100,r:40,t:70,b:110};
  const z=Math.min(1.2,(r.width-pad.l-pad.r)/(b.x1-b.x0),(r.height-pad.t-pad.b)/(b.y1-b.y0));
  if(anim){world.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';setTimeout(()=>world.style.transition='',520);}
  view={z,x:pad.l+((r.width-pad.l-pad.r)-(b.x1-b.x0)*z)/2-b.x0*z,y:pad.t+((r.height-pad.t-pad.b)-(b.y1-b.y0)*z)/2-b.y0*z};applyView();}
const fit=anim=>{const ids=Object.keys(S.tiles);if(ids.length)goTo(bounds(ids),anim);};
/* Concentrati: il riquadro scelto (o sotto il mouse) e quelli collegati */
let lastHover=null;tilesEl.addEventListener('pointerover',e=>{const t=e.target.closest('.tile');if(t)lastHover=t.dataset.id;});
document.getElementById('focus').onclick=()=>{const id=selTile||lastHover;if(!id)return fit(true);const ids=[id,...linksOf(id).flatMap(l=>[l.a,l.b])];goTo(bounds([...new Set(ids)]),true);selectTile(id);lightUp(id);};

/* Minimappa nel dock */
const mini=document.querySelector('#mini canvas');
function drawMini(){const g=mini.getContext('2d'),W=mini.width,H=mini.height;g.clearRect(0,0,W,H);const ids=Object.keys(S.tiles);if(!ids.length)return;
  const b=bounds(ids),pad=60,sx=(b.x1-b.x0+pad*2),sy=(b.y1-b.y0+pad*2),k=Math.min(W/sx,H/sy),ox=(W-sx*k)/2,oy=(H-sy*k)/2,m=(x,y)=>[ox+(x-b.x0+pad)*k,oy+(y-b.y0+pad)*k];
  g.fillStyle=tok('--s-row');g.fillRect(0,0,W,H);
  for(const a of Object.values(S.areas)){const [x,y]=m(a.x,a.y);g.strokeStyle=a.c+'88';g.setLineDash([3,3]);g.strokeRect(x,y,a.w*k,a.h*k);}g.setLineDash([]);
  g.strokeStyle=tok('--s-dim');g.lineWidth=1;for(const l of S.links){const A=S.tiles[l.a],B=S.tiles[l.b];if(!A||!B)continue;const [x1,y1]=m(A.x+A.w/2,A.y+A.h/2),[x2,y2]=m(B.x+B.w/2,B.y+B.h/2);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
  for(const [id,t] of Object.entries(S.tiles)){const [x,y]=m(t.x,t.y);g.fillStyle=id===selTile?tok('--s-sig'):tok('--s-edge-2');g.fillRect(x,y,Math.max(2,t.w*k),Math.max(2,t.h*k));}
  const r=viewEl.getBoundingClientRect(),[vx,vy]=m(-view.x/view.z,-view.y/view.z);g.strokeStyle=tok('--s-sig');g.lineWidth=2;g.strokeRect(vx,vy,r.width/view.z*k,r.height/view.z*k);
  drawMini.map={b,pad,k,ox,oy};}
mini.parentElement.onclick=e=>{const M=drawMini.map;if(!M)return;const r=mini.getBoundingClientRect(),sx=mini.width/r.width,px=(e.clientX-r.left)*sx,py=(e.clientY-r.top)*sx;
  const wx=(px-M.ox)/M.k+M.b.x0-M.pad,wy=(py-M.oy)/M.k+M.b.y0-M.pad,v=viewEl.getBoundingClientRect();
  world.style.transition='transform .35s ease';setTimeout(()=>world.style.transition='',380);view.x=v.width/2-wx*view.z;view.y=v.height/2-wy*view.z;applyView();};

/* Tema: in VARCO arriva da data.appearance; qui lo sceglie il pannello dell'anteprima */
const TKEY='pp-theme-v4';let TH={id:'varco',mode:'scuro',accent:'',accent2:''};try{Object.assign(TH,JSON.parse(localStorage.getItem(TKEY))||{})}catch{}
const acol=c=>c==='#7c6cff'?tok('--s-sig'):col(c);
function tapeColors(){areasEl.querySelectorAll('.area').forEach(el=>{const a=S.areas[el.dataset.id];if(!a)return;const c=acol(a.c);el.style.setProperty('--ac',c);el.style.setProperty('--on-ac',Strumento.onColor(c));});}
function applyTheme(){const base=Strumento.themeOf(TH.id,TH),vars=Strumento.strumentoTokens({...base,mode:TH.mode});
  for(const [k,v] of Object.entries(vars))document.documentElement.style.setProperty(k,v);
  document.getElementById('tpn').textContent=Strumento.THEMES[TH.id].label+' · '+({scuro:'scuro',chiaro:'chiaro',oled:'OLED'})[TH.mode];
  document.querySelectorAll('#tpg button').forEach(b=>b.classList.toggle('on',b.dataset.t===TH.id));
  document.querySelectorAll('#tpm button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===TH.mode));
  document.getElementById('tpa').value=base.accent;document.getElementById('tpb').value=vars['--s-alt'];
  try{localStorage.setItem(TKEY,JSON.stringify(TH))}catch{};tapeColors();drawWires();drawMini();if(selWire!=null)pickWire(selWire);}
document.getElementById('tpg').innerHTML=Object.entries(Strumento.THEMES).map(([id,t])=>`<button data-t="${id}" title="${t.label}" style="background:${t.bg}"><i style="background:${t.accent}"></i></button>`).join('');
document.querySelectorAll('#tpg button').forEach(b=>b.onclick=()=>{TH={...TH,id:b.dataset.t,accent:'',accent2:''};applyTheme();});
document.querySelectorAll('#tpm button').forEach(b=>b.onclick=()=>{TH.mode=b.dataset.m;applyTheme();});
document.getElementById('tpa').oninput=e=>{TH.accent=e.target.value;applyTheme();};
document.getElementById('tpb').oninput=e=>{TH.accent2=e.target.value;applyTheme();};
document.getElementById('tpr').onclick=()=>{TH.accent='';TH.accent2='';applyTheme();};
document.getElementById('tph').onclick=()=>document.getElementById('tp').classList.toggle('min');
function setStyle(st){document.documentElement.dataset.style=st;try{localStorage.setItem('pp-style',st)}catch{};
  document.querySelectorAll('#stylesw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st));drawWires();if(selWire!=null)pickWire(selWire);}
render();applyTheme();fit(false);addEventListener('resize',drawMini);
</script>
