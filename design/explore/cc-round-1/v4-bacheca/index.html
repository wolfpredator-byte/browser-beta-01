<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>V4 · Bacheca</title>
<script src="../../lettore-round-2/shared/theme.js"></script>
<link rel="stylesheet" href="../../lettore-round-1/shared/frame.css">
<link rel="stylesheet" href="../../lettore-round-2/shared/varco.css">
<link rel="stylesheet" href="../shared/cc.css">
<style>
/* V4 — Bacheca (soft-glass/widget, pin 2/22): il command center occupa la pagina; "Apri subito" sono tessere
   grandi con la miniatura, le altre sezioni sono card-widget richiudibili; le azioni stanno in una barra in basso. */
.v4{position:absolute;left:62px;right:10px;top:74px;bottom:56px;display:flex;flex-direction:column;gap:14px;padding:6px 18px 0}
.top{display:flex;align-items:center;gap:14px}
.search{flex:1;display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;border-radius:999px;background:rgba(var(--glass-rgb),.88);backdrop-filter:blur(30px);
  border:1px solid rgba(var(--line-rgb),.3);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.search>.ic{width:21px;height:21px;color:var(--acc)}
.search .cc-input{font-size:17px}
.segm{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(var(--glass-rgb),.8);border:1px solid var(--line)}
.scroll{flex:1;overflow:auto;padding-bottom:80px;scrollbar-width:thin}
.now{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{position:relative;padding:10px;border-radius:16px;background:rgba(var(--glass-rgb),.82);backdrop-filter:blur(24px);border:1px solid rgba(var(--line-rgb),.18);display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.tile .cc-thumb{aspect-ratio:16/9;border-radius:10px}
.tile .big{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;background:rgba(0,0,0,.25);color:var(--acc)}
.tile .big .ic{width:30px;height:30px}
.tile b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.tile.sel{border-color:rgba(var(--acc-rgb),.75);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.5),0 0 28px rgba(var(--acc-rgb),.2)}
.lab{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin:2px 0 8px 4px;display:flex;align-items:center;gap:8px}
.lab .ic{width:13px;height:13px}
.cards{column-count:3;column-gap:12px}
.card{break-inside:avoid;margin-bottom:12px;border-radius:18px;background:rgba(var(--glass-rgb),.82);backdrop-filter:blur(24px);border:1px solid rgba(var(--line-rgb),.18);padding:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ch{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px 6px;font-size:12px;color:var(--muted)}
.ch .ic{width:15px;height:15px}
.ch b{font-weight:600;color:var(--fg);font-size:13px}
.ch .n{font-size:10.5px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.07)}
.ch .tog{margin-left:auto;transition:transform .15s;width:14px;height:14px}
.card.closed .tog{transform:rotate(-90deg)}
.r{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;min-height:40px}
.r:hover{background:rgba(255,255,255,.04)}
.r.sel{background:rgba(var(--acc-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.5)}
.r .t{flex:1;min-width:0;display:flex;flex-direction:column}
.r .t b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .t span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{font-size:10.5px;color:var(--faint);padding:4px 10px 0}
.more{margin:2px 10px 6px;font-size:11.5px;color:var(--acc)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px}
.grid6 .r{flex-direction:column;align-items:flex-start;gap:6px;background:rgba(255,255,255,.035);padding:10px}
.grid6 .r .t span{white-space:normal}
.groups{display:flex;gap:6px;flex-wrap:wrap;padding:2px 10px 6px}
.groups i{font-style:normal;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.05);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.groups i::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.jcard{background:linear-gradient(180deg,rgba(var(--acc-rgb),.1),rgba(var(--glass-rgb),.82) 60%)}
.ask{display:flex;align-items:center;gap:8px;margin:2px 8px 6px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);color:var(--faint);font-size:12.5px}
.ask .ic{width:15px;height:15px;color:var(--acc)}.ask .mic{margin-left:auto;color:var(--muted)}
.bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;
  background:rgba(var(--glass-rgb),.95);backdrop-filter:blur(30px);border:1px solid rgba(var(--line-rgb),.32);box-shadow:0 18px 50px rgba(0,0,0,.55);max-width:calc(100% - 40px)}
.bar .who{display:flex;align-items:center;gap:8px;max-width:260px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who .cc-ico{width:22px;height:22px;border-radius:6px}
.bar .cc-act{border-radius:999px;padding:6px 12px;font-size:12px}
.bar .sep{width:1px;height:20px;background:var(--line)}
.pop{position:fixed;z-index:20;width:300px;padding:12px;border-radius:16px;background:rgba(var(--glass-rgb),.97);border:1px solid rgba(var(--line-rgb),.3);box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;pointer-events:none}
</style></head><body>
<script src="../shared/cc.js"></script>
<script>
const {m,I,esc}=CC;
let popAt=null;
function render(){
  const root=document.getElementById('cc-root');
  const old=root.querySelector('.scroll');const top=old?old.scrollTop:0;
  const gs=CC.groups(),cur=CC.current();let k=0;
  const nowG=gs.find(g=>g.id==='now');
  const tiles=nowG?nowG.shown.map(x=>{const idx=k++;return `<button class="tile${idx===m.sel?' sel':''}" data-i="${idx}">${x.site?CC.thumb(x.site,x.title):`<div class="big">${I[x.kind==='server'?'server':x.kind==='project'?'folder':'cmd']}</div>`}<b>${esc(x.title)}</b><span>${esc(x.sub||'')}</span></button>`;}).join(''):'';
  const row=(x,i,g)=>{const idx=k++;return `${i===g.split?'<div class="split">Altri workspace</div>':''}<div class="r${idx===m.sel?' sel':''}${x.off?' cc-off':''}" data-i="${idx}">${CC.icon(x)}<div class="t"><b>${esc(x.title)}</b>${x.sub?`<span>${esc(x.sub)}</span>`:''}</div>${x.ws!==CC.ACTIVE?`<span class="cc-ws" style="--w:${CC.WS[x.ws]}"></span>`:''}${x.key?`<kbd>${x.key}</kbd>`:''}</div>`;};
  const cards=gs.filter(g=>g.id!=='now').map(g=>{
    let inner='';
    if(!g.collapsed){
      if(g.id==='create'&&!m.q)inner=`<div class="grid6">${g.shown.map((x,i)=>row(x,i,g)).join('')}</div>`;
      else if(g.id==='jarvis')inner=`<div class="ask">${I.spark}${m.q?esc(CC.parse().raw):'Chiedi qualcosa, o scrivi «?» nella barra…'}<span class="mic">${I.mic}</span></div>${g.shown.map((x,i)=>row(x,i,g)).join('')}`;
      else inner=(g.id==='links'?`<div class="groups">${[['Sviluppo','#00e5ff'],['Destiny','#ffb648'],['Unity','#9c8cff'],['Musica','#1ed760']].map(([n,c])=>`<i style="--c:${c}">${n}</i>`).join('')}</div>`:'')+g.shown.map((x,i)=>row(x,i,g)).join('');
      if(g.more)inner+=`<button class="more" data-expand="${g.id}">Mostra tutti (${g.items.length})</button>`;
    }
    return `<section class="card${g.collapsed?' closed':''}${g.id==='jarvis'?' jcard':''}"><button class="ch" data-toggle="${g.id}">${I[g.icon]}<b>${g.title}</b><span class="n">${g.items.length}</span>${g.prefix?`<kbd>${esc(g.prefix.trim())}</kbd>`:''}${I.down.replace('class="ic"','class="ic tog"')}</button>${inner}</section>`;
  }).join('');
  const acts=cur?.actions||[];
  root.innerHTML=`<div class="v4"><div class="top"><div class="search">${I.search}<span id="slot"></span><kbd>Esc</kbd></div><div class="segm">${CC.scopeChips()}</div></div>
    <div class="scroll">${nowG?`<div class="lab">${I.bolt}${nowG.title}${m.q?'':' · '+CC.ACTIVE}</div><div class="now">${tiles}</div>`:''}
      ${gs.length?`<div class="cards">${cards}</div>`:`<div class="cc-empty"><b>Nessun risultato per «${esc(m.q)}»</b>Nessuna scheda, progetto o comando. Prova «? ${esc(m.q)}» per chiederlo a Jarvis.</div>`}</div>
    ${cur?`<div class="bar"><span class="who">${CC.icon(cur)}${esc(cur.title)}</span><span class="sep"></span>${acts.map((a,j)=>`<button class="cc-act${j===m.act?' on':''}" data-a="${j}">${a}</button>`).join('')}<span class="sep"></span><span class="cc-hint"><span><kbd>Tab</kbd></span><span><kbd>Invio</kbd></span></span></div>`:''}</div>
    ${m.hover&&popAt&&!['create','jarvis','jsum','jsave'].includes(m.hover.kind)?`<div class="pop" style="left:${popAt.x}px;top:${popAt.y}px">${CC.preview(m.hover)}</div>`:''}`;
  root.querySelector('#slot').replaceWith(CC.input('Cerca, apri o crea qualcosa…'));
  const sc=root.querySelector('.scroll');sc.scrollTop=top;sc.querySelector('.sel')?.scrollIntoView({block:'nearest'});
  root.querySelectorAll('[data-i]').forEach(r=>{const x=CC.flat()[+r.dataset.i];
    r.onmouseenter=()=>{const b=r.getBoundingClientRect();const x0=b.right+10+300>innerWidth?b.left-310:b.right+10;popAt={x:x0,y:Math.min(b.top,innerHeight-330)};if(r.classList.contains('tile'))return;CC.hover(x);};
    r.onmouseleave=()=>CC.hover(null);
    r.onclick=()=>{m.sel=+r.dataset.i;m.act=0;CC.run(x,0);CC.update();};});
  root.querySelectorAll('.bar [data-a]').forEach(b=>b.onclick=()=>{m.act=+b.dataset.a;CC.run(cur,m.act);CC.update();});
}
CC.mount(render);
</script>
</body></html>
